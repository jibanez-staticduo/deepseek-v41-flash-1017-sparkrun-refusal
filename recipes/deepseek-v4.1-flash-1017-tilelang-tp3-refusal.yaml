recipe_version: "2"
runtime: vllm-distributed
container: registry.example.com/deepseek1017-refusal@sha256:1111111111111111111111111111111111111111111111111111111111111111
model_revision: "1bae0e1088993b9b82de08f59de5be5a34e42170"
model: "/srv/models/deepseek-v4.1-flash-1017"
min_nodes: 3
max_nodes: 3
builder: docker-pull
defaults:
  tensor_parallel: 3
  pipeline_parallel: 1
  max_model_len: 1048576
  gpu_memory_utilization: 0.82
metadata:
  description: "Example only: edit immutable image and local mounts before use"
executor_config:
  entrypoint: ""
  ipc: host
  shm_size: 16gb
  network: host
  privileged: false
  user: "0:0"
  cap_add: [IPC_LOCK]
  devices: ["/dev/dri/card0:/dev/dri/card0:rwm", "/dev/infiniband:/dev/infiniband:rwm"]
  gpus: "all"
  memory_limit: "112g"
  security_opt: ["seccomp=unconfined"]
  ulimit: ["memlock=-1:-1", "stack=67108864:67108864", "core=0"]
  volumes:
    - "/srv/models/deepseek-v4.1-flash-1017:/srv/models/deepseek-v4.1-flash-1017:ro"
    - "/srv/cache/deepseek1017:/cache/runtime:rw"
    - "/srv/secrets/refusal-admin-token:/srv/secrets/refusal-admin-token:ro"
    - "/srv/sparkrun-refusal/site.json:/etc/sparkrun-refusal/site.json:ro"
distribution_config:
  models:
    enabled: false
    entries: []
runtime_cache:
  enabled: false
env:
  B12X_AUTOTUNE: "0"
  B12X_BIND_COMPILE_WORKERS: "2"
  B12X_COMPILE_CACHE_DIR: "/cache/kkref/jit/b12x/compile"
  B12X_CUTE_COMPILE_CACHE_DIR: "/cache/kkref/jit/b12x/cute"
  B12X_DENSE_SPLITK_TURBO: "1"
  B12X_STATE_COMPILE_WORKERS: "2"
  B12X_W4A8_TINY_DECODE: "0"
  B12X_WEIGHTS_COMPILE_WORKERS: "4"
  CUDA_CACHE_MAXSIZE: "4294967296"
  CUDA_CACHE_PATH: "/cache/kkref/jit/nv-compute"
  CUDA_DEVICE_MAX_CONNECTIONS: "32"
  CUTE_DSL_ARCH: "sm_121a"
  CUTE_DSL_CACHE_DIR: "/cache/kkref/jit/cute-dsl"
  FLASHINFER_WORKSPACE_BASE: "/cache/kkref/flashinfer"
  HF_HOME: "/cache/huggingface"
  HF_HUB_OFFLINE: "1"
  MAX_JOBS: "2"
  NCCL_BUFFSIZE: "1048576"
  NCCL_CROSS_NIC: "1"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_DEBUG: "WARN"
  NCCL_DEBUG_SUBSYS: "INIT"
  NCCL_IB_ADDR_FAMILY: "AF_INET"
  NCCL_IB_DISABLE: "0"
  NCCL_IB_MERGE_NICS: "1"
  NCCL_IB_ROCE_VERSION_NUM: "2"
  NCCL_IB_SUBNET_AWARE_ROUTING: "1"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  NCCL_LL128_BUFFSIZE: "262144"
  NCCL_MAX_NCHANNELS: "8"
  NCCL_NET: "IB"
  NCCL_NET_PLUGIN: "none"
  NCCL_NVLS_ENABLE: "0"
  NCCL_P2P_DISABLE: "1"
  NCCL_PROTO: "^LL128"
  NCCL_SHM_DISABLE: "1"
  OMP_NUM_THREADS: "8"
  PYTHONPATH: "/opt/spark3/candidate/vllm:/opt/spark3/candidate/b12x"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True,garbage_collection_threshold:0.6"
  SAFETENSORS_FAST_GPU: "1"
  SPARK3_DISPLAY_CARVEOUT_WEIGHTS: "1"
  SPARK3_DSPARK_DEAD_ROWS_TAU: "0.2"
  SPARK3_DSPARK_MAIN_PROJ_TP: "1"
  SPARK3_DSPARK_PROFILE_TOKENS: "random"
  SPARK3_DSPARK_VOCAB_PARALLEL: "1"
  SPARKNET_ROCE_ALLGATHER_MAX_BYTES: "4194304"
  SPARKNET_ROCE_ALLREDUCE_CAPACITY_BYTES: "2097152"
  SPARKNET_ROCE_ALLREDUCE_DISPATCH_MAX_BYTES: "2097152"
  SPARKNET_ROCE_PROXY_CPU: "big"
  SPARKNET_ROCE_TIMEOUT_MS: "10000"
  SPARKRUN_NO_RUNTIME_CACHE: "1"
  STATICDUO_REFUSAL_ADMIN_TOKEN_FILE: "/srv/secrets/refusal-admin-token"
  TILELANG_CACHE_DIR: "/cache/kkref/jit/tilelang"
  TORCHINDUCTOR_CACHE_DIR: "/cache/kkref/jit/torchinductor"
  TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
  TRANSFORMERS_OFFLINE: "1"
  TRITON_CACHE_DIR: "/cache/kkref/jit/triton"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_CACHE_DIR: "/cache/kkref/jit/vllm-r5o"
  VLLM_CACHE_ROOT: "/cache/kkref/jit/vllm-r5o"
  VLLM_DISABLE_PYNCCL: "0"
  VLLM_DS41_ATTENTION_COMPUTE: "auto"
  VLLM_DS41_DRAFT_NVFP4_HEAD: "0"
  VLLM_DS41_HEAD_DTYPE: "float32"
  VLLM_DS41_KERNEL_BACKEND: "tilelang"
  VLLM_DS41_MARKOV_NVFP4: "0"
  VLLM_DS41_PACKED_BF16_LM_HEAD: "1"
  VLLM_ENABLE_PCIE_ALLREDUCE: "0"
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "900"
  VLLM_L2_PREFETCH_GRID: "2"
  VLLM_L2_PREFETCH_KERNELS: "tilelang"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "1"
  VLLM_MULTI_STREAM_GEMM_TOKEN_THRESHOLD: "1024"
  VLLM_PLUGINS: "b12x_loader"
  VLLM_REFUSAL_DIRS: "/opt/sparkrun-refusal/refusal_dirs_1017.safetensors"
  VLLM_REFUSAL_LAMBDA_INIT: "2.5"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_STANDALONE_COMPILE: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  XDG_CACHE_HOME: "/cache/kkref/jit"
command: >-
  python3 /opt/sparkrun-refusal/launch.py --model {model} --revision 1bae0e1088993b9b82de08f59de5be5a34e42170
  --profile maximum1M
  --served-model-name deepseek-v4.1-flash-1017
  --site /etc/sparkrun-refusal/site.json
  --runtime-config /opt/sparkrun-refusal/runtime.json
